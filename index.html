<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SR Creations | Wedding, Event & Portrait Photography</title>
    <meta
      name="description"
      content="SR Creations captures weddings, birthdays, baby showers and bridal portraits through artistic photography and cinematic storytelling. Explore the portfolio and enquire about your date."
    />
    <meta name="theme-color" content="#0e0c0d" />
    <link rel="canonical" href="https://sr-photography-site.vercel.app/" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SR Creations" />
    <meta property="og:title" content="SR Creations | Wedding, Event & Portrait Photography" />
    <meta property="og:description" content="Timeless memories through cinematic storytelling and elegant photography." />
    <meta property="og:url" content="https://sr-photography-site.vercel.app/" />
    <meta property="og:image" content="https://sr-photography-site.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Hero image is preloaded so the largest paint is not delayed by JS. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(min-width: 768px)"
      imagesrcset="/images/optimized/marriage2-1200.avif 1200w, /images/optimized/marriage2-1800.avif 1800w, /images/optimized/marriage2-2400.avif 2400w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      media="(max-width: 767.98px)"
      imagesrcset="/images/optimized/marriage3-480.avif 480w, /images/optimized/marriage3-800.avif 800w, /images/optimized/marriage3-1200.avif 1200w"
      imagesizes="100vw"
      fetchpriority="high"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "SR Creations",
        "description": "Wedding, event, birthday, baby shower and bridal portrait photography with cinematic videography.",
        "url": "https://sr-photography-site.vercel.app/",
        "image": "https://sr-photography-site.vercel.app/og-image.jpg",
        "logo": "https://sr-photography-site.vercel.app/images/optimized/logo-320.webp",
        "sameAs": ["https://www.instagram.com/suriya_rlove"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#f4efe6;background:#0e0c0d">
        SR Creations — wedding &amp; event photography. Please enable JavaScript to view the portfolio, or reach us on
        <a style="color:#e6d2a8" href="https://www.instagram.com/suriya_rlove">Instagram</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
